services:
  floppy:
    image: ghcr.io/dannyvfilms/floppy:latest
    restart: unless-stopped
    environment:
      TZ: "Europe/Moscow"
      HTTP_PROXY: "http://host.docker.internal:7897"
      HTTPS_PROXY: "http://host.docker.internal:7897"
      SECRET: "${SECRET}"
      URLS: "https://floppy.home.hexmelt.com"
      REDIS_URL: "redis://floppy-redis:6379"
      DEMO_ACCOUNT_ENABLED: "False"
      DEBUG: "False"
      REGISTRATION: "${REGISTRATION}"
      TMDB_API: "${TMDB_API}"
    ports:
      - "8000:8000"

    volumes:
      - type: volume
        source: floppy-db
        target: /floppy/db
        volume:
          nocopy: true
      - type: volume
        source: floppy-backups
        target: /floppy/backups
        volume:
          nocopy: true
    depends_on:
      floppy-redis:
        condition: service_healthy
  floppy-mcp:
    image: ghcr.io/dannyvfilms/floppy:latest
    restart: unless-stopped
    command:
      - python
      - -c
      - |
        from floppy_mcp.server import mcp
        from mcp.server.transport_security import TransportSecuritySettings
        mcp.settings.host = "0.0.0.0"
        mcp.settings.port = 8000
        mcp.settings.stateless_http = True
        mcp.settings.transport_security = TransportSecuritySettings(
          enable_dns_rebinding_protection=False,
        )
        mcp.run(transport="streamable-http")
    environment:
      FLOPPY_URL: "http://floppy:8000"
      FLOPPY_TOKEN: "${FLOPPY_TOKEN}"
    depends_on:
      floppy:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=5).close()"
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  floppy-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--save"
      - ""
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "volatile-lru"
    volumes:
      - type: volume
        source: floppy-redis
        target: /data
        volume:
          nocopy: true

    healthcheck:
      test:
        - "CMD"
        - "redis-cli"
        - "ping"
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  floppy-db:
    name: floppy_db
    external: true
  floppy-backups:
    name: floppy_backups
    external: true
  floppy-redis:
    name: floppy_redis
    external: true

networks:
  default:
    name: homelab
    external: true
