services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    volumes:
      - type: volume
        source: home-assistant-config
        target: /config
        volume:
          nocopy: true
    ports:
      - "8123:8123"
    environment:
      - TZ=Europe/Moscow


networks:
  default:
    name: homelab
    external: true

volumes:
  home-assistant-config:
    external: true
    name: home_assistant_config
