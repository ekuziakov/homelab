services:
  caddy:
    build: .
    restart: unless-stopped
    env_file:
      - .env

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Needed for HTTP/3
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        bind:
          create_host_path: true
      - type: volume
        source: caddy-data
        target: /data
        volume:
          nocopy: true
      - type: volume
        source: caddy-config
        target: /config
        volume:
          nocopy: true

volumes:
  caddy-data:
    name: caddy_data
    external: true
  caddy-config:
    name: caddy_config
    external: true

networks:
  default:
    name: homelab
    external: true
