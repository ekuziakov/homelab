services:
  caddy:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Needed for HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - type: volume
        source: caddy-data
        target: /data
        volume:
          nocopy: true
      - type: volume
        source: caddy-config
        target: /config
        volume:
          nocopy: true
    env_file:
      - .env


networks:
  default:
    name: homelab
    external: true

volumes:
  caddy-data:
    external: true
    name: caddy_data
  caddy-config:
    external: true
    name: caddy_config
