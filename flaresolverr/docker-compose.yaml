services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: "info"
      LOG_HTML: "false"
      CAPTCHA_SOLVER: "none"
      TZ: "Europe/Moscow"
      PROXY_URL: "http://host.docker.internal:7897"
    volumes:
      - type: volume
        source: config
        target: /config
        volume:
          nocopy: false
    tmpfs:
      - /tmp:size=256M,mode=1777
    shm_size: "256mb"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --noproxy
        - "*"
        - http://127.0.0.1:8191/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  config:
    name: flaresolverr_config
    external: true

networks:
  default:
    name: homelab
    external: true
