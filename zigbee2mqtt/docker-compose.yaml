services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: on-failure
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ../../data/zigbee2mqtt/mosquitto:/mosquitto/data
    ports:
      - "1883:1883"

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt
    restart: on-failure
    volumes:
      - ../../data/zigbee2mqtt/zigbee2mqtt:/app/data
      - ./zigbee2mqtt/configuration.yaml:/app/data/configuration.yaml
    ports:
      - 8080:8080
    environment:
      - TZ=Europe/Moscow
    depends_on:
      - mosquitto
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
