services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "1883:1883"

    volumes:
      - type: bind
        source: ./mosquitto/config
        target: /mosquitto/config
        bind:
          create_host_path: true
      - type: volume
        source: mosquitto-data
        target: /mosquitto/data
        volume:
          nocopy: true
  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt
    restart: unless-stopped
    environment:
      TZ: "Europe/Moscow"
    ports:
      - "8080:8080"
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"

    volumes:
      - type: volume
        source: zigbee2mqtt-data
        target: /app/data
        volume:
          nocopy: true
      - type: bind
        source: ./zigbee2mqtt/data/configuration.yaml
        target: /app/data/configuration.yaml
        read_only: false
        bind:
          create_host_path: false
    depends_on:
      mosquitto:
        condition: service_started

volumes:
  mosquitto-data:
    name: mosquitto_data
    external: true
  zigbee2mqtt-data:
    name: zigbee2mqtt_data
    external: true

networks:
  default:
    name: homelab
    external: true
