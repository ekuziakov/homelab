services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - type: volume
        source: mosquitto-data
        target: /mosquitto/data
        volume:
          nocopy: true
    ports:
      - "1883:1883"

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt
    restart: unless-stopped
    volumes:
      - type: volume
        source: zigbee2mqtt-data
        target: /app/data
        volume:
          nocopy: true
      - type: bind
        source: ./zigbee2mqtt/data/configuration.yaml
        target: /app/data/configuration.yaml
        read_only: false
        bind:
          create_host_path: false
    ports:
      - 8080:8080
    environment:
      - TZ=Europe/Moscow
    depends_on:
      - mosquitto
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0


networks:
  default:
    name: homelab
    external: true

volumes:
  mosquitto-data:
    external: true
    name: mosquitto_data
  zigbee2mqtt-data:
    external: true
    name: zigbee2mqtt_data
