services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: on-failure
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    ports:
      - "1883:1883"

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt
    restart: on-failure
    volumes:
      - ./zigbee2mqtt/data:/app/data
    ports:
      - 8080:8080
    environment:
      - TZ=Europe/Moscow
    depends_on:
      - mosquitto
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0


networks:
  default:
    name: homelab
    external: true
