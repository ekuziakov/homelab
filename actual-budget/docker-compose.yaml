services:
  actual:
    image: actualbudget/actual-server:latest
    restart: unless-stopped
    volumes:
      - type: volume
        source: actual-budget-data
        target: /data
        volume:
          nocopy: true
    ports:
      - "5006:5006"
    environment:
      - TZ=Europe/Moscow


networks:
  default:
    name: homelab
    external: true

volumes:
  actual-budget-data:
    external: true
    name: actual_budget_data
