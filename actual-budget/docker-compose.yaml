services:
  actual:
    image: actualbudget/actual-server:latest
    restart: unless-stopped
    environment:
      TZ: "Europe/Moscow"
    ports:
      - "5006:5006"
    volumes:
      - type: volume
        source: actual-budget-data
        target: /data
        volume:
          nocopy: true

volumes:
  actual-budget-data:
    name: actual_budget_data
    external: true

networks:
  default:
    name: homelab
    external: true
