services:
  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    volumes:
      - ./data:/opt/data
    ports:
      - "9119:9119"   # dashboard
    environment:
      HTTP_PROXY: http://host.docker.internal:7897
      HTTPS_PROXY: http://host.docker.internal:7897
    command: gateway run
